name: i2c
version: 0.1.0
spec: '0.1'
kind: ip
lang: bsv
identity:
  slug: i2c-tapeout-bsv
  display_name: I2C controller
  summary: I2C master and slave, seven and ten bit addressing.
  category: peripheral
  subcategories:
  - i2c
  ip_family: i2c
  integration_profile:
  - apb4-slave
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: flat
    aw: 8
    dw: 32
  irq:
  - name: irq
    kind: level
params:
  fifoDepth:
    type: int
    default: 4
    range:
    - 1
    - 32
features:
  slave:
    type: bool
    default: false
    area:
      points:
        '1': 208.04
        '2': 208.04
        '4': 208.04
        '8': 208.04
      per: fifoDepth
test:
  # 一个寄存器里所有字段的 swmod 脉冲是同一个信号，实现读其中一个就够，
  # 其余是同一根线的别名。
  unused:
  - cmd_ack_wr
  - cmd_wr_wr
  - cmd_rd_wr
  - cmd_stop_wr
emit:
- kind: bsv
  package: I2c
  module: mkI2c
  config_type: I2cCfg
  interface: I2cIfc
  ctrl: regs
  pins:
  - name: pins
    type: I2cPins
- kind: verilog-flat
  bus: apb4
deps:
  hwcore: ^0.1
  amba: ^0.1
area:
  base:
    points:
      '1': 941.92
      '2': 941.92
      '4': 941.92
      '8': 941.92
    per: fifoDepth
  margin: 0.005
  model: points-additive
  error:
    bound: 0.01
    sign: over
    note: parameter curves stored as measured points, features added on top, then
      lifted by 0.005 so that no untested combination predicts under; the worst came
      in -0.00 percent under before the lift
  measured:
  - at:
      fifoDepth: 1
      slave: false
    um2: 941.92
  - at:
      fifoDepth: 2
      slave: false
    um2: 941.92
  - at:
      fifoDepth: 4
      slave: false
    um2: 941.92
  - at:
      fifoDepth: 8
      slave: false
    um2: 941.92
  - at:
      fifoDepth: 1
      slave: true
    um2: 1149.96
  - at:
      fifoDepth: 2
      slave: true
    um2: 1149.96
  - at:
      fifoDepth: 4
      slave: true
    um2: 1149.96
  - at:
      fifoDepth: 8
      slave: true
    um2: 1149.96
  corner:
    tool: ecc
    pdk: ics55
    freq_mhz: 100
    measured: '2026-09-08'
    gen_digest: sha256:bb3ce058bbf2b69d
